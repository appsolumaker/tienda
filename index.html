<!DOCTYPE html>
<html lang="es-VE" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo online</title>
<script>
// ══════════════════════════════════════════════════════════════
//  CONFIGURACIÓN DE LA TIENDA — una copia de este archivo por cliente.
//  Más adelante el Worker de MiTiendaMaster llenará este bloque solo.
// ══════════════════════════════════════════════════════════════
window.TIENDA = {
  negocio:       "",     // ← nombre del negocio (sale arriba al instante)
  mostrarNombre: true,   // ← false si el logo ya trae el nombre escrito
  cliente:       "",     // ← identificador de fotos del cliente (Configuración H34)
  sistema:       "",     // ← URL /exec de ControlMaster del cliente
  whatsapp:      ""      // ← opcional: WhatsApp de la tienda (ej. 584141234567). Vacío = el de Configuración H33
};
// ══════════════════════════════════════════════════════════════
(function () {
  var T = window.TIENDA, q = new URLSearchParams(location.search);
  // Demo para prospectos (con el bloque vacío): ?c=<identificador>&s=<ID o URL del /exec>&n=<nombre>
  if (!T.cliente) T.cliente = (q.get("c") || "").toLowerCase().trim();
  if (!T.sistema) {
    var s = (q.get("s") || "").trim();
    T.sistema = !s ? "" : (s.indexOf("http") === 0 ? s : "https://script.google.com/macros/s/" + s + "/exec");
  }
  if (!T.negocio) T.negocio = (q.get("n") || "").trim();
  T.fotos          = "https://fotos.micontrolmaster.com";
  T.logo           = T.cliente ? T.fotos + "/" + T.cliente + "/logo.webp" : "";
  T.catalogoRapido = T.cliente ? T.fotos + "/" + T.cliente + "/catalogo.json" : "";
  T.clave          = T.cliente || T.sistema;   // separa lo que guarda el navegador por tienda
  if (T.logo) {
    var l = document.createElement("link");
    l.rel = "preload"; l.as = "image"; l.href = T.logo;
    document.head.appendChild(l);
  }
  if (T.negocio) document.title = T.negocio + " · Catálogo";
})();
</script>
<link rel="preconnect" href="https://fotos.micontrolmaster.com">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"></noscript>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --azul:#1B45E0; --azul-claro:#EEF2FE; --amarillo:#FFC91D;
  --fondo:#F7F8FB; --carta:#FFFFFF; --foto:#F2F4F8;
  --texto:#12172B; --texto-2:#6B7490; --linea:#E9ECF3;
  --verde:#1F9D55; --wa:#25D366; --rojo:#E23D28;
  --r:16px;
  --alto-tope:59px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--texto);
  font-family:Poppins,"Segoe UI",system-ui,sans-serif;font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font-family:inherit;font-size:16px}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.tope{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--carta);border-bottom:1px solid var(--linea)}
.tope-in{max-width:1120px;margin:0 auto;padding:0 16px;height:58px;display:flex;align-items:center;gap:12px}
.marca{display:flex;align-items:center;gap:10px;min-width:0}
.logo{height:40px;width:auto;max-width:140px;object-fit:contain;display:block;flex:0 0 auto}
.negocio{font-weight:800;font-size:17px;letter-spacing:-.3px;color:var(--azul);min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-carrito{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--azul);
  padding:9px 15px;border-radius:999px;font-weight:600;color:#fff;font-size:13.5px;flex:0 0 auto}
.pill{background:var(--amarillo);color:#33280A;border-radius:999px;min-width:21px;height:21px;
  display:grid;place-items:center;font-size:12px;font-weight:700;padding:0 6px}

.tasa{background:var(--azul-claro);color:var(--azul);font-size:12.5px}
.tasa-in{max-width:1120px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tasa b{font-weight:700}

.controles{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--alto-tope));z-index:30;background:var(--carta);border-bottom:1px solid var(--linea)}
.controles-in{max-width:1120px;margin:0 auto;padding:12px 16px 10px}
.buscador{position:relative}
.buscador input{width:100%;padding:12px 14px 12px 40px;border-radius:12px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--texto);font-weight:500}
.buscador input::placeholder{color:var(--texto-2);font-weight:400}
.buscador svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.45}
.chips{display:flex;gap:8px;overflow-x:auto;padding:11px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 15px;border-radius:999px;border:1px solid var(--linea);
  background:var(--carta);color:var(--texto-2);font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--texto);border-color:var(--texto);color:var(--carta);font-weight:600}

main{max-width:1120px;margin:0 auto;padding:16px 16px 40px}
.conteo{color:var(--texto-2);font-size:12.5px;margin:0 0 12px;min-height:19px}
.rejilla{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.rejilla{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:920px){.rejilla{grid-template-columns:repeat(4,1fr)}}

.card{background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.card.sin{background:#FAFBFC}
.card.sin .foto-caja img{filter:grayscale(1);opacity:.45}
.card.sin .nom,.card.sin .cod{color:var(--texto-2)}
.card.sin .precio{color:var(--texto-2);font-weight:700}
.card.sin .bs{opacity:.7}
.foto-caja{position:relative;background:var(--foto);aspect-ratio:1/1;overflow:hidden}
.foto-caja img{width:100%;height:100%;object-fit:contain;display:block}
.sinfoto{width:100%;height:100%;display:grid;place-items:center;color:var(--texto-2);font-size:11px;text-align:center;padding:10px}
.etq{position:absolute;top:9px;left:9px;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:999px;
  background:var(--carta);color:var(--texto-2);border:1px solid var(--linea)}
.etq.poco{background:#FFF6DB;color:#8A6400;border-color:#FFE9A8}
.etq.no{background:#FDEDEA;color:var(--rojo);border-color:#F7C9C1;font-weight:800}
.card-b{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.cod{font-size:10.5px;color:var(--texto-2);font-weight:500}
.nom{font-size:13.5px;font-weight:500;line-height:1.35;margin:0;min-height:36px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.precio{font-weight:800;font-size:20px;letter-spacing:-.6px;margin-top:4px}
.bs{font-size:11.5px;color:var(--texto-2);margin-top:-2px}
.add{margin-top:12px;background:var(--amarillo);color:#33280A;font-weight:700;padding:11px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;letter-spacing:.2px}
.add:disabled{background:var(--foto);color:var(--texto-2);cursor:not-allowed}

/* Tarjetas "esqueleto" mientras llega el catálogo la primera vez */
.card.esq .foto-caja,.esq-l{background:linear-gradient(90deg,#ECEEF3 25%,#F6F7FA 50%,#ECEEF3 75%);background-size:200% 100%;animation:brillo 1.2s ease-in-out infinite}
.esq-l{height:12px;border-radius:6px;margin:5px 0}
@keyframes brillo{from{background-position:200% 0}to{background-position:-200% 0}}

.aviso-pag{text-align:center;padding:60px 20px;color:var(--texto-2);font-size:13.5px}
.aviso-pag b{display:block;color:var(--texto);font-size:16px;font-weight:700;margin-bottom:6px}
.cargando{text-align:center;color:var(--texto-2);font-size:12.5px;padding:18px}
footer{border-top:1px solid var(--linea);background:var(--carta);color:var(--texto-2);font-size:12px}
.foot-in{max-width:1120px;margin:0 auto;padding:22px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px}

.velo{position:fixed;inset:0;background:rgba(18,23,43,.45);z-index:50;display:none}
.velo.on{display:block}
.gaveta{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--carta);border-radius:22px 22px 0 0;
  max-height:88vh;display:none;flex-direction:column;box-shadow:0 -10px 40px rgba(18,23,43,.18);
  transform:translateY(100%);transition:transform .25s ease}
.gaveta.on{display:flex;transform:translateY(0)}
@media(min-width:720px){.gaveta{left:auto;right:0;top:0;bottom:0;width:420px;max-height:none;border-radius:0;transform:translateX(100%)}
  .gaveta.on{transform:translateX(0)}}
.g-top{padding:16px 18px 12px;border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:10px}
.g-top h2{font-size:16.5px;font-weight:700;margin:0}
.cerrar{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--fondo);display:grid;place-items:center;font-size:16px;color:var(--texto-2)}
.g-cuerpo{overflow-y:auto;padding:12px 18px;flex:1;-webkit-overflow-scrolling:touch}
.g-pie{border-top:1px solid var(--linea);padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));background:var(--carta)}

.linea{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--linea)}
.linea:last-child{border-bottom:0}
.linea .mini{width:56px;height:56px;border-radius:12px;background:var(--foto);flex:0 0 auto;overflow:hidden}
.linea .mini img{width:100%;height:100%;object-fit:contain}
.linea .info{flex:1;min-width:0}
.linea .info p{margin:0;font-size:13px;line-height:1.3;font-weight:500}
.linea .info small{color:var(--texto-2);font-size:11.5px;display:block}
.cant{display:flex;align-items:center;border:1px solid var(--linea);border-radius:10px;overflow:hidden;margin-top:8px;width:max-content}
.cant button{width:30px;height:30px;font-size:16px;color:var(--azul);font-weight:700;background:var(--fondo)}
.cant button:disabled{color:var(--texto-2);opacity:.5}
.cant input{width:58px;height:30px;text-align:center;font-weight:700;font-size:13px;border:0;background:transparent;color:var(--texto);-moz-appearance:textfield}
.cant input::-webkit-outer-spin-button,.cant input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.quitar{color:var(--rojo);font-size:11.5px;font-weight:600;margin-top:6px;display:block}

.totales{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px;color:var(--texto-2)}
.totales.grande{font-size:18px;color:var(--texto);font-weight:800;margin-bottom:6px}
.nota{font-size:11.5px;color:var(--texto-2);margin:8px 0 12px;line-height:1.4}
.btn-wa{width:100%;background:var(--wa);color:#04321A;font-weight:700;padding:14px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;gap:8px;font-size:14.5px;text-decoration:none}
.btn-wa:disabled{opacity:.6;cursor:not-allowed}
.btn-sec{width:100%;padding:12px;border-radius:13px;border:1px solid var(--linea);color:var(--texto-2);font-weight:600;margin-top:8px}

.modal{position:fixed;z-index:70;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(440px,calc(100vw - 32px));max-height:86vh;overflow-y:auto;background:var(--carta);
  border-radius:20px;box-shadow:0 20px 60px rgba(18,23,43,.28);display:none}
.modal.on{display:block}
#mAviso{z-index:75}
.m-cuerpo{padding:20px}
.m-cuerpo h3{font-size:17.5px;font-weight:800;margin:0 0 6px;letter-spacing:-.3px}
.m-cuerpo p{margin:0 0 14px;color:var(--texto-2);font-size:13px;line-height:1.45}
.campo{margin-bottom:11px}
.campo label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}
.campo input,.campo select{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--linea);background:var(--fondo);color:var(--texto)}
.campo input::placeholder{color:var(--texto-2);opacity:.75}
.fila{display:flex;gap:10px}
.fila .campo{flex:1}
.ci{display:flex;gap:8px}
.ci select{width:74px;flex:0 0 auto}
.err{color:var(--rojo);font-size:12px;margin:2px 0 10px;display:none;line-height:1.4}
.err.on{display:block}
.btn-pri{width:100%;background:var(--azul);color:#fff;font-weight:700;padding:13px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;gap:8px}
.btn-pri:disabled{opacity:.65;cursor:not-allowed}
.aviso-ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px;margin-bottom:10px;background:var(--fondo)}
.paso{background:#FFF6DB;border:1.5px solid #FFD84D;border-radius:13px;padding:13px 14px;margin-bottom:14px}
.paso b{display:block;font-size:13.5px;margin-bottom:3px;color:#7A5A00}
.paso span{font-size:12.5px;color:#8A6400;line-height:1.45}
.resumen{background:var(--fondo);border-radius:13px;padding:13px 14px;font-size:12.5px;margin-bottom:14px}
.resumen .r-l{display:flex;justify-content:space-between;gap:10px;padding:3px 0;color:var(--texto-2)}
.resumen .r-l span:last-child{color:var(--texto);font-weight:500;text-align:right}
.resumen .r-l.tot{border-top:1px solid var(--linea);margin-top:7px;padding-top:8px;font-weight:700;color:var(--texto)}
.fin-estado{font-size:12px;color:var(--texto-2);margin:12px 0 0;text-align:center;line-height:1.45;display:flex;gap:7px;align-items:center;justify-content:center}
.fin-estado.ok{color:var(--verde);font-weight:600}

.sp{width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;display:inline-block;animation:giro .7s linear infinite;flex:0 0 auto}
.sp.oscuro{border-color:rgba(0,0,0,.2);border-top-color:#04321A}
.sp.azul{border-color:rgba(27,69,224,.25);border-top-color:var(--azul)}
@keyframes giro{to{transform:rotate(360deg)}}

#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(14px);
  background:var(--texto);color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;font-weight:500;
  z-index:80;opacity:0;pointer-events:none;transition:.22s ease;box-shadow:0 8px 24px rgba(18,23,43,.25);max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header class="tope">
  <div class="tope-in">
    <div class="marca">
      <img class="logo" id="logo" alt="" decoding="async">
      <span class="negocio" id="negocio"></span>
    </div>
    <button class="btn-carrito" onclick="abrirCarrito()" aria-label="Ver carrito">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.6 12.3h11L21 7H6"/></svg>
      <span class="pill" id="pillCant">0</span>
    </button>
  </div>
</header>
<script>
// Logo y nombre salen del bloque TIENDA: no esperan a ControlMaster.
(function () {
  var T = window.TIENDA, img = document.getElementById("logo"), n = document.getElementById("negocio");
  if (T.logo) {
    img.onerror = function () { img.remove(); window._sinLogo = true; if (window.pintarNombre) window.pintarNombre(); };
    img.alt = T.negocio || "Logo";
    img.src = T.logo;
  } else { img.remove(); window._sinLogo = true; }
  if (T.mostrarNombre !== false || !T.logo) n.textContent = T.negocio || "";
})();
</script>

<div class="tasa"><div class="tasa-in"><span>Tasa BCV: <b id="tasaTxt">—</b> Bs/$</span></div></div>

<div class="controles">
  <div class="controles-in">
    <div class="buscador">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar producto o código" oninput="filtrar()" autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<main>
  <p class="conteo" id="conteo"></p>
  <div class="rejilla" id="rejilla"></div>
  <div class="cargando" id="masAbajo" style="display:none">Cargando más productos…</div>
  <div class="aviso-pag" id="estado" style="display:none"></div>
</main>

<footer>
  <div class="foot-in">
    <span id="pieNegocio"></span>
    <span>Los pedidos se confirman por WhatsApp. El envío se cotiza aparte.</span>
  </div>
</footer>

<div class="velo" id="velo" onclick="cerrarTodo()"></div>

<aside class="gaveta" id="gaveta" role="dialog" aria-label="Tu pedido">
  <div class="g-top"><h2>Tu pedido</h2><button class="cerrar" onclick="cerrarTodo()" aria-label="Cerrar">✕</button></div>
  <div class="g-cuerpo" id="lineas"></div>
  <div class="g-pie" id="piePedido"></div>
</aside>

<div class="modal" id="mDatos" role="dialog" aria-label="Tus datos">
  <div class="m-cuerpo">
    <h3>Solo faltan tus datos</h3>
    <div class="fila">
      <div class="campo"><label for="f_nom">Nombre</label><input id="f_nom" placeholder="Ej: María" autocomplete="given-name"></div>
      <div class="campo"><label for="f_ape">Apellido</label><input id="f_ape" placeholder="Ej: Pérez" autocomplete="family-name"></div>
    </div>
    <div class="campo">
      <label for="f_ci">Cédula</label>
      <div class="ci">
        <select id="f_tipo"><option>V</option><option>E</option><option>J</option></select>
        <input id="f_ci" inputmode="numeric" placeholder="12345678">
      </div>
    </div>
    <div class="campo"><label for="f_tel">Teléfono (WhatsApp)</label><input id="f_tel" inputmode="tel" placeholder="0414 1234567" autocomplete="tel"></div>
    <div class="campo"><label for="f_dir">Ciudad o zona de entrega</label><input id="f_dir" placeholder="Ej: Maracay, Base Aragua"></div>
    <div class="err" id="errDatos"></div>
    <button class="btn-wa" id="btnEnviar" onclick="enviarPedido()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15L2 22l5.2-1.4A10 10 0 1012 2zm0 18a8 8 0 01-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1112 20zm4.4-5.8c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1l-.7.9c-.1.2-.3.2-.5.1a6.5 6.5 0 01-3.2-2.8c-.1-.2 0-.4.1-.5l.4-.5c.1-.2.1-.3 0-.5l-.7-1.6c-.2-.4-.4-.4-.5-.4h-.5c-.2 0-.5.1-.7.3a2.9 2.9 0 00-.9 2.1c0 1.3.9 2.5 1 2.6a10 10 0 003.9 3.4c1.8.7 1.8.5 2.2.5.3 0 1.2-.5 1.4-1 .2-.5.2-.9.1-1z"/></svg>
      Enviar pedido por WhatsApp
    </button>
    <button class="btn-sec" onclick="cerrarModales()">Volver al carrito</button>
  </div>
</div>

<div class="modal" id="mFinal" role="dialog" aria-label="Pedido enviado">
  <div class="m-cuerpo">
    <div class="aviso-ico">✅</div>
    <h3 id="finTitulo">Pedido</h3>
    <p id="finTxt"></p>
    <div class="paso" id="finPaso"></div>
    <div class="resumen" id="resDatos"></div>
    <a class="btn-wa" id="btnWa" href="#" target="_blank" rel="noopener">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15L2 22l5.2-1.4A10 10 0 1012 2zm0 18a8 8 0 01-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1112 20zm4.4-5.8c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1l-.7.9c-.1.2-.3.2-.5.1a6.5 6.5 0 01-3.2-2.8c-.1-.2 0-.4.1-.5l.4-.5c.1-.2.1-.3 0-.5l-.7-1.6c-.2-.4-.4-.4-.5-.4h-.5c-.2 0-.5.1-.7.3a2.9 2.9 0 00-.9 2.1c0 1.3.9 2.5 1 2.6a10 10 0 003.9 3.4c1.8.7 1.8.5 2.2.5.3 0 1.2-.5 1.4-1 .2-.5.2-.9.1-1z"/></svg>
      <span id="btnWaTxt">Abrir WhatsApp</span>
    </a>
    <p class="fin-estado" id="finEstado"></p>
    <button class="btn-sec" id="finListo" onclick="terminar()">Ya lo envié por WhatsApp</button>
  </div>
</div>

<div class="modal" id="mAviso" role="alertdialog" aria-label="Aviso">
  <div class="m-cuerpo">
    <div class="aviso-ico" id="avisoIco">ℹ️</div>
    <h3 id="avisoTit">Aviso</h3>
    <p id="avisoTxt"></p>
    <button class="btn-pri" onclick="cerrarAviso()">Entendido</button>
  </div>
</div>

<div id="toast"></div>

<script>
const T = window.TIENDA;
const SIN_CATEGORIA = "Otros";
const LOTE   = 12;
const K_CAT  = "cm_cat_"  + T.clave;   // último catálogo visto (pinta al instante en la próxima visita)
const K_PEND = "cm_pend_" + T.clave;   // pedidos que aún no llegaron a ControlMaster

let CAT = null, INDICE = {}, filtrados = [], categoria = "", pintados = 0, carrito = {};
const enVuelo = {};

function $(id){ return document.getElementById(id); }
function r2(v){ return Math.round((Number(v) || 0) * 100) / 100; }
function usd(v){ return Number(v).toLocaleString("es-VE",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function bs(v){ return usd(Number(v) * (CAT ? Number(CAT.tasa) || 0 : 0)); }
function num(v){ return Number(v).toLocaleString("es-VE"); }
function prod(c){ return INDICE[String(c)]; }
function subtotal(p, q){ return r2(p.p * q); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

// Nombre arriba y en el pie. Si el logo trae el nombre (mostrarNombre:false) solo se escribe cuando no hay logo.
function pintarNombre(){
  const nom = T.negocio || (CAT && CAT.negocio) || "";
  $("negocio").textContent = (T.mostrarNombre !== false || window._sinLogo) ? nom : "";
  $("pieNegocio").textContent = nom;
  if (nom) document.title = nom + " · Catálogo";
}

// ══════════ CARGA DEL CATÁLOGO ══════════
// 1) Lo último que vio este navegador se pinta al instante.
// 2) Se pide el catálogo nuevo: primero la copia rápida (R2) y, si no existe, el /exec.
// 3) Si cambió, se repinta sin perder la búsqueda, la categoría ni el carrito.
async function cargar(){
  if (!T.catalogoRapido && !T.sistema){
    mostrarEstado("<b>Falta indicar la tienda</b>Llena el bloque TIENDA al inicio del archivo, o agrega <code>?c=</code> y <code>?s=</code> al enlace.");
    return;
  }
  let guardado = null;
  try { guardado = JSON.parse(localStorage.getItem(K_CAT) || "null"); } catch(e) {}
  if (guardado && Array.isArray(guardado.productos)) aplicarCatalogo(guardado);
  else mostrarEsqueleto();

  try {
    const fresco = await traerCatalogo();
    if (!CAT || fresco.sello !== CAT.sello) aplicarCatalogo(fresco);
    try { localStorage.setItem(K_CAT, JSON.stringify(fresco)); } catch(e) {}
  } catch(e) {
    if (!CAT){
      $("rejilla").innerHTML = "";
      mostrarEstado("<b>No se pudo cargar el catálogo</b>Revisa tu conexión e intenta de nuevo. Si el problema sigue, avísale a la tienda.");
    }
  }
  reintentarPendientes();
}

async function traerCatalogo(){
  if (T.catalogoRapido){
    try {
      const r = await fetch(T.catalogoRapido, { cache: "no-cache" });
      if (r.ok){
        const d = await r.json();
        if (d && Array.isArray(d.productos)) return d;
      }
    } catch(e) {}
  }
  if (!T.sistema) throw new Error("Sin catálogo rápido ni sistema");
  const r = await fetch(T.sistema + "?api=catalogo");
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  return d;
}

function aplicarCatalogo(d){
  const primera = !CAT;
  d.productos.forEach(p => { p.c = String(p.c); if (!p.g) p.g = SIN_CATEGORIA; });
  CAT = d;
  INDICE = {};
  CAT.productos.forEach(p => { INDICE[p.c] = p; });

  pintarNombre();
  $("tasaTxt").textContent = usd(d.tasa || 0);

  const cats = (d.categorias || []).filter(c => c);
  if (CAT.productos.some(p => p.g === SIN_CATEGORIA) && cats.indexOf(SIN_CATEGORIA) < 0) cats.push(SIN_CATEGORIA);
  if (categoria && cats.indexOf(categoria) < 0) categoria = "";
  $("chips").innerHTML =
    '<button class="chip" data-cat="" aria-pressed="' + (categoria ? "false" : "true") + '">Todo</button>' +
    cats.map(c => '<button class="chip" data-cat="' + esc(c) + '" aria-pressed="' + (c === categoria) + '">' + esc(c) + '</button>').join("");

  $("estado").style.display = "none";
  if (primera) filtrar();
  else { ajustarCarrito(); repintar(); }
}

function mostrarEstado(html){ const e = $("estado"); e.innerHTML = html; e.style.display = "block"; }

function mostrarEsqueleto(){
  $("estado").style.display = "none";
  let h = "";
  for (let i = 0; i < 8; i++)
    h += '<div class="card esq" aria-hidden="true"><div class="foto-caja"></div><div class="card-b">' +
         '<div class="esq-l" style="width:40%"></div><div class="esq-l"></div><div class="esq-l" style="width:70%"></div>' +
         '<div class="esq-l" style="width:50%;height:20px;margin-top:8px"></div></div></div>';
  $("rejilla").innerHTML = h;
}

$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (!b) return;
  categoria = b.dataset.cat || "";
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
  filtrar();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

function filtrar(){
  if (!CAT) return;
  const q = $("q").value.trim().toLowerCase();
  filtrados = CAT.productos.filter(p => {
    if (categoria && p.g !== categoria) return false;
    if (!q) return true;
    return String(p.n).toLowerCase().includes(q) || p.c.toLowerCase().includes(q);
  });
  pintados = 0;
  $("rejilla").innerHTML = "";
  if (!filtrados.length) mostrarEstado("<b>Sin resultados</b>Prueba con otro nombre o revisa las categorías.");
  else $("estado").style.display = "none";
  $("conteo").textContent = filtrados.length
    ? filtrados.length + (filtrados.length > 1 ? " productos" : " producto") + (categoria ? " en " + categoria : "")
    : "";
  pintarLote();
}

// Vuelve a pintar lo mismo que ya se veía (no salta al inicio de la lista)
function repintar(){
  const antes = pintados;
  filtrar();
  while (pintados < antes && pintados < filtrados.length) pintarLote();
}

function imagen(p){
  if (p.i) return '<img src="' + esc(p.i) + '" alt="' + esc(p.n) + '" loading="lazy" decoding="async" onerror="sinFoto(this)">';
  return '<div class="sinfoto">Sin foto</div>';
}
function sinFoto(img){ const d = document.createElement("div"); d.className = "sinfoto"; d.textContent = "Sin foto"; img.replaceWith(d); }

function pintarLote(){
  const cont = $("rejilla");
  filtrados.slice(pintados, pintados + LOTE).forEach(p => {
    const d = document.createElement("article");
    d.className = "card" + (p.e === 0 ? " sin" : "");
    const etq = p.e === 0 ? '<span class="etq no">Agotado</span>'
              : p.e === 1 ? '<span class="etq poco">Últimas unidades</span>' : "";
    const txt = p.e === 0 ? "NO DISPONIBLE" : (carrito[p.c] ? "AGREGAR OTRO" : "AGREGAR");
    d.innerHTML = `
      <div class="foto-caja">${imagen(p)}${etq}</div>
      <div class="card-b">
        <span class="cod">${esc(p.c)}</span>
        <p class="nom">${esc(p.n)}</p>
        <span class="precio">$${usd(p.p)}</span>
        <span class="bs">Bs ${bs(p.p)}</span>
        <button class="add" data-c="${esc(p.c)}" ${p.e === 0 ? "disabled" : ""}>${txt}</button>
      </div>`;
    cont.appendChild(d);
  });
  pintados += Math.min(LOTE, filtrados.length - pintados);
  $("masAbajo").style.display = pintados < filtrados.length ? "block" : "none";
}

$("rejilla").addEventListener("click", e => {
  const b = e.target.closest("button.add");
  if (b && !b.disabled) agregar(b.dataset.c, b);
});

window.addEventListener("scroll", () => {
  if (!CAT || pintados >= filtrados.length) return;
  if (window.innerHeight + window.scrollY > document.body.offsetHeight - 500) pintarLote();
});

// ══════════ CARRITO ══════════
function agregar(cod, btn){
  const p = prod(cod);
  if (!p) return;
  const actual = carrito[p.c] || 0;
  if (actual + 1 > p.m){
    aviso("No hay más unidades", "De <b>" + esc(p.n) + "</b> no queda más existencia de la que ya tienes en tu pedido.", "⚠️");
    return;
  }
  carrito[p.c] = actual + 1;
  refrescarPill();
  toast("Agregado: " + p.n.slice(0, 28) + (p.n.length > 28 ? "…" : ""));
  if (btn) btn.textContent = "AGREGAR OTRO";
}

function refrescarPill(){ $("pillCant").textContent = num(Object.values(carrito).reduce((a, b) => a + b, 0)); }
function totalUSD(){ return r2(Object.entries(carrito).reduce((s, [c, q]) => { const p = prod(c); return s + (p ? subtotal(p, q) : 0); }, 0)); }

function abrirCarrito(){
  pintarCarrito();
  $("velo").classList.add("on");
  $("gaveta").classList.add("on");
}

function pintarCarrito(){
  const cont = $("lineas"), pie = $("piePedido");
  const items = Object.entries(carrito).filter(([c]) => prod(c));
  if (!items.length){
    cont.innerHTML = '<div class="aviso-pag"><b>Tu pedido está vacío</b>Agrega productos del catálogo y aquí los revisas antes de enviarlos.</div>';
    pie.innerHTML = '<button class="btn-sec" onclick="cerrarTodo()">Seguir viendo productos</button>';
    return;
  }
  cont.innerHTML = items.map(([cod, q]) => {
    const p = prod(cod), c = esc(cod);
    return `<div class="linea">
      <div class="mini">${imagen(p)}</div>
      <div class="info">
        <p>${esc(p.n)}</p>
        <small>$${usd(p.p)} c/u · Bs ${bs(p.p)}</small>
        <div class="cant">
          <button data-acc="menos" data-c="${c}" aria-label="Quitar uno">−</button>
          <input type="number" inputmode="numeric" value="${q}" min="1" max="${p.m}" data-c="${c}" aria-label="Cantidad">
          <button data-acc="mas" data-c="${c}" ${q >= p.m ? "disabled" : ""} aria-label="Agregar uno">+</button>
        </div>
        <button class="quitar" data-acc="quitar" data-c="${c}">Quitar del pedido</button>
      </div>
      <div style="text-align:right;font-weight:700;font-size:13px">$${usd(subtotal(p, q))}</div>
    </div>`;
  }).join("");

  const t = totalUSD();
  pie.innerHTML = `
    <div class="totales grande"><span>Total</span><span>$${usd(t)}</span></div>
    <div class="totales"><span>En bolívares (tasa ${usd(CAT.tasa)})</span><span>Bs ${bs(t)}</span></div>
    <p class="nota">El envío no está incluido. Se acuerda contigo por WhatsApp según tu zona.</p>
    <button class="btn-wa" onclick="pedirDatos()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15L2 22l5.2-1.4A10 10 0 1012 2zm0 18a8 8 0 01-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1112 20zm4.4-5.8c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1l-.7.9c-.1.2-.3.2-.5.1a6.5 6.5 0 01-3.2-2.8c-.1-.2 0-.4.1-.5l.4-.5c.1-.2.1-.3 0-.5l-.7-1.6c-.2-.4-.4-.4-.5-.4h-.5c-.2 0-.5.1-.7.3a2.9 2.9 0 00-.9 2.1c0 1.3.9 2.5 1 2.6a10 10 0 003.9 3.4c1.8.7 1.8.5 2.2.5.3 0 1.2-.5 1.4-1 .2-.5.2-.9.1-1z"/></svg>
      Finalizar pedido por WhatsApp
    </button>
    <button class="btn-sec" onclick="cerrarTodo()">Seguir comprando</button>`;
}

$("lineas").addEventListener("click", e => {
  const b = e.target.closest("button[data-acc]");
  if (!b || b.disabled) return;
  const c = b.dataset.c, a = b.dataset.acc;
  cambiar(c, a === "menos" ? -1 : a === "mas" ? 1 : -999);
});
$("lineas").addEventListener("change", e => {
  const i = e.target.closest("input[data-c]");
  if (i) fijar(i.dataset.c, i);
});

function cambiar(cod, d){
  const p = prod(cod);
  if (d === -999 || !p){ delete carrito[cod]; }
  else {
    const nuevo = (carrito[cod] || 0) + d;
    if (nuevo > p.m){ aviso("Sin más existencia", "De <b>" + esc(p.n) + "</b> no hay más unidades disponibles.", "⚠️"); return; }
    if (nuevo <= 0) delete carrito[cod]; else carrito[cod] = nuevo;
  }
  refrescarPill(); pintarCarrito();
}

function fijar(cod, input){
  const p = prod(cod), v = Math.floor(Number(input.value));
  if (!p || !v || v <= 0){ delete carrito[cod]; refrescarPill(); pintarCarrito(); return; }
  if (v > p.m){
    aviso("Cantidad mayor a la existencia",
      "Pediste " + num(v) + " unidades de <b>" + esc(p.n) + "</b> y no hay tantas disponibles. Dejamos la cantidad en el máximo que podemos despachar.", "⚠️");
    carrito[cod] = p.m;
  } else carrito[cod] = v;
  refrescarPill(); pintarCarrito();
}

// Cuando llega un catálogo más nuevo: lo que ya no alcanza se ajusta y se avisa.
function ajustarCarrito(){
  const cambios = [];
  Object.keys(carrito).forEach(c => {
    const p = prod(c), q = carrito[c];
    if (!p || p.m <= 0){
      cambios.push("• <b>" + esc(p ? p.n : c) + "</b>: " + (p ? "se agotó" : "ya no está disponible") + " y lo quitamos de tu pedido.");
      delete carrito[c];
    } else if (q > p.m){
      cambios.push("• <b>" + esc(p.n) + "</b>: quedan " + num(p.m) + " y ajustamos tu cantidad.");
      carrito[c] = p.m;
    }
  });
  refrescarPill();
  if ($("gaveta").classList.contains("on")) pintarCarrito();
  if (cambios.length)
    aviso("La existencia cambió",
      "Actualizamos el catálogo y cambió la existencia de productos de tu pedido:<br><br>" + cambios.join("<br>") +
      "<br><br>Revisa tu pedido antes de enviarlo.", "⚠️");
}

// ══════════ PEDIDO ══════════
function pedirDatos(){
  if (!Object.keys(carrito).length) return;
  if (CAT && CAT.activa === false){
    aviso("Tienda de demostración", "Esta tienda es una demostración: los pedidos están desactivados. Puedes ver los productos y los precios, pero todavía no se pueden enviar pedidos.", "ℹ️");
    return;
  }
  $("gaveta").classList.remove("on");
  $("errDatos").classList.remove("on");
  $("mDatos").classList.add("on");
  $("velo").classList.add("on");
  try {
    const g = JSON.parse(localStorage.getItem("cm_cliente") || "null");
    if (g){
      $("f_nom").value = g.nom || ""; $("f_ape").value = g.ape || ""; $("f_tipo").value = g.tipo || "V";
      $("f_ci").value = g.ci || "";   $("f_tel").value = g.tel || ""; $("f_dir").value = g.dir || "";
    }
  } catch(e) {}
}

// Referencia del pedido: número de 7 dígitos que sale en WhatsApp, en la hoja Pedidos y en la orden de la caja.
function nuevaRef(){
  let n;
  try { const a = new Uint32Array(1); crypto.getRandomValues(a); n = a[0]; }
  catch(e) { n = Math.floor(Math.random() * 4294967295); }
  return String(1000000 + (n % 9000000));
}

function numeroWhatsApp(){
  let n = String(T.whatsapp || (CAT && CAT.whatsapp) || "").replace(/\D/g, "");
  if (n.length === 11 && n.charAt(0) === "0") n = "58" + n.slice(1);   // 0414… → 58414…
  return n;
}

// Mismo formato que el que armaba el servidor (textoWhatsAppPedido_).
function textoWhatsApp(ref, d, lineas, total, tasa, totalBs){
  const negocio = T.negocio || (CAT && CAT.negocio) || "";
  const mostrar = lineas.slice(0, 8);
  let t = "Pedido #" + ref + (negocio ? " · " + negocio : "") + "\n";
  t += d.nom + " " + d.ape + " · " + d.tipo + "-" + d.ci + "\n";
  if (d.dir) t += "Entrega: " + d.dir + "\n";
  t += "\n";
  mostrar.forEach(l => {
    const nom = l.n.length > 32 ? l.n.slice(0, 32) + "…" : l.n;
    t += l.q + " x " + nom + " — $" + usd(l.sub) + "\n";
  });
  if (lineas.length > mostrar.length)
    t += "…y " + (lineas.length - mostrar.length) + " productos más (detalle completo en el pedido #" + ref + ")\n";
  t += "\nTotal: $" + usd(total) + "\n";
  t += "Tasa BCV: " + usd(tasa) + "\n";
  t += "Total en Bs: " + usd(totalBs) + "\n\n";
  t += "El costo del envío se acuerda por este medio.";
  return t;
}

function enviarPedido(){
  const btn = $("btnEnviar");
  if (btn.disabled) return;
  const err = $("errDatos");
  const d = { nom: $("f_nom").value.trim(), ape: $("f_ape").value.trim(), tipo: $("f_tipo").value,
              ci: $("f_ci").value.replace(/\D/g, ""), tel: $("f_tel").value.trim(), dir: $("f_dir").value.trim() };
  let falla = "";
  if (!d.nom || !d.ape) falla = "Escribe tu nombre y tu apellido para identificar el pedido.";
  else if (d.ci.length < 6) falla = "La cédula debe tener al menos 6 dígitos, sin puntos ni guiones.";
  else if (d.tel.replace(/\D/g, "").length < 10) falla = "El teléfono debe tener 11 dígitos, empezando por el código de la operadora.";
  else if (!d.dir) falla = "Indica tu ciudad o zona para poder calcular el envío.";
  if (falla){ err.textContent = falla; err.classList.add("on"); return; }
  err.classList.remove("on");

  const items = Object.entries(carrito).filter(([c]) => prod(c));
  if (!items.length){
    cerrarTodo();
    aviso("Tu pedido está vacío", "Agrega productos del catálogo antes de enviar el pedido.", "⚠️");
    return;
  }

  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="sp oscuro"></span> Abriendo WhatsApp…';

  const ref     = nuevaRef();
  const lineas  = items.map(([c, q]) => { const p = prod(c); return { c: c, n: p.n, q: q, pu: p.p, sub: subtotal(p, q) }; });
  const total   = r2(lineas.reduce((s, l) => s + l.sub, 0));
  const tasa    = Number(CAT.tasa) || 0;
  const totalBs = r2(total * tasa);

  // 1) El pedido se guarda en este teléfono y se registra en ControlMaster por detrás.
  if (T.sistema){
    const pedido = { ref: ref, nombre: d.nom, apellido: d.ape, tipoDoc: d.tipo, cedula: d.ci,
                     telefono: d.tel, entrega: d.dir, total: total,
                     items: lineas.map(l => ({ c: l.c, q: l.q, n: l.n, p: l.pu })) };
    guardarPendiente(pedido);
    registrar(pedido);
  }

  // 2) WhatsApp se abre en este mismo toque: si se espera al servidor, el navegador lo bloquea.
  const wa  = numeroWhatsApp();
  const url = wa ? "https://wa.me/" + wa + "?text=" + encodeURIComponent(textoWhatsApp(ref, d, lineas, total, tasa, totalBs)) : "";
  let abierto = false;
  if (url){
    try {
      const w = window.open(url, "_blank");
      if (w){ abierto = true; try { w.opener = null; } catch(e) {} }
    } catch(e) {}
  }

  try { localStorage.setItem("cm_cliente", JSON.stringify(d)); } catch(e) {}
  carrito = {};
  refrescarPill();
  repintar();
  mostrarFinal(ref, d, total, tasa, totalBs, url, abierto);
  btn.disabled = false;
  btn.innerHTML = original;
}

function mostrarFinal(ref, d, total, tasa, totalBs, url, abierto){
  $("mDatos").classList.remove("on");
  const m = $("mFinal");
  m.dataset.ref = ref;
  $("finTitulo").textContent = "Pedido #" + ref;
  $("finTxt").textContent = !url ? "Tu pedido quedó guardado."
    : abierto ? "Abrimos WhatsApp con tu pedido ya escrito."
    : "Toca el botón verde para abrir WhatsApp con tu pedido ya escrito.";
  $("finPaso").innerHTML = url
    ? "<b>⚠️ Falta un paso: toca Enviar en WhatsApp</b><span>Tu pedido se confirma cuando la tienda recibe tu mensaje. Ahí acuerdan el envío y la forma de pago.</span>"
    : "<b>La tienda te escribirá</b><span>Esta tienda todavía no tiene su WhatsApp configurado. Te contactará al teléfono que indicaste.</span>";
  $("resDatos").innerHTML = `
    <div class="r-l"><span>Cliente</span><span>${esc(d.nom)} ${esc(d.ape)}</span></div>
    <div class="r-l"><span>Cédula</span><span>${esc(d.tipo)}-${esc(d.ci)}</span></div>
    <div class="r-l"><span>Entrega</span><span>${esc(d.dir)}</span></div>
    <div class="r-l tot"><span>Total</span><span>$${usd(total)}</span></div>
    <div class="r-l"><span>Tasa BCV ${usd(tasa)}</span><span>Bs ${usd(totalBs)}</span></div>`;
  const wa = $("btnWa");
  if (url){ wa.style.display = "flex"; wa.href = url; $("btnWaTxt").textContent = abierto ? "Abrir WhatsApp de nuevo" : "Abrir WhatsApp"; }
  else wa.style.display = "none";
  $("finListo").textContent = url ? "Ya lo envié por WhatsApp" : "Listo";
  const est = $("finEstado");
  est.className = "fin-estado";
  if (T.sistema){ est.style.display = "flex"; est.innerHTML = '<span class="sp azul"></span><span>Avisándole a la tienda…</span>'; }
  else est.style.display = "none";
  m.classList.add("on");
  $("velo").classList.add("on");
}

function estadoFinal(ref, est){
  const m = $("mFinal");
  if (m.dataset.ref !== ref) return;
  const e = $("finEstado");
  e.className = "fin-estado" + (est === "ok" ? " ok" : "");
  e.textContent =
    est === "ok"        ? "✓ La tienda ya tiene tu pedido en su sistema." :
    est === "inactiva"  ? "Esta tienda no está recibiendo pedidos por la página en este momento. Tu pedido igual va completo en tu mensaje de WhatsApp." :
    est === "rechazado" ? "El sistema de la tienda no aceptó el pedido por falta de datos. Igual va completo en tu mensaje de WhatsApp." :
                          "Aún no pudimos avisarle al sistema de la tienda. Lo reintentaremos solo cuando vuelvas a esta página; tu pedido igual va completo en tu mensaje de WhatsApp.";
}

function terminar(){ cerrarTodo(); }

// ══════════ REGISTRO EN SEGUNDO PLANO ══════════
// Cada pedido queda guardado en este navegador hasta que ControlMaster confirma que lo recibió.
// Si se reintenta, el servidor reconoce la referencia y no lo duplica.
function leerPend(){ try { const a = JSON.parse(localStorage.getItem(K_PEND) || "[]"); return Array.isArray(a) ? a : []; } catch(e) { return []; } }
function escribirPend(a){ try { localStorage.setItem(K_PEND, JSON.stringify(a)); } catch(e) {} }
function guardarPendiente(p){ const a = leerPend().filter(x => x.ref !== p.ref); a.push(Object.assign({ intentos: 0, creado: Date.now() }, p)); escribirPend(a); }
function quitarPendiente(ref){ escribirPend(leerPend().filter(x => x.ref !== ref)); }
function sumarIntento(ref){ const a = leerPend(); a.forEach(x => { if (x.ref === ref) x.intentos = (x.intentos || 0) + 1; }); escribirPend(a); }

function registrar(p){
  if (!T.sistema || enVuelo[p.ref]) return;
  enVuelo[p.ref] = true;
  const cuerpo = JSON.stringify({ ref: p.ref, nombre: p.nombre, apellido: p.apellido, tipoDoc: p.tipoDoc,
                                  cedula: p.cedula, telefono: p.telefono, entrega: p.entrega,
                                  total: p.total, items: p.items });
  fetch(T.sistema, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: cuerpo,
    keepalive: cuerpo.length < 60000   // sigue aunque el navegador pase a WhatsApp
  })
    .then(r => r.json())
    .then(res => {
      if (res && res.ok){ quitarPendiente(p.ref); estadoFinal(p.ref, "ok"); return; }
      if (res && (res.motivo === "vacio" || res.motivo === "datos" || res.motivo === "inactiva")){ quitarPendiente(p.ref); estadoFinal(p.ref, res.motivo === "inactiva" ? "inactiva" : "rechazado"); return; }
      throw new Error((res && res.msg) || "Respuesta inesperada");
    })
    .catch(() => { sumarIntento(p.ref); estadoFinal(p.ref, "pendiente"); })
    .finally(() => { delete enVuelo[p.ref]; });
}

function reintentarPendientes(){
  if (!T.sistema) return;
  const ahora = Date.now(), vivos = leerPend().filter(p => (p.intentos || 0) < 8 && ahora - (p.creado || 0) < 3 * 86400000);
  escribirPend(vivos);
  vivos.forEach(registrar);
}
window.addEventListener("online", reintentarPendientes);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reintentarPendientes(); });

// ══════════ AVISOS ══════════
function aviso(tit, html, ico){
  $("avisoTit").textContent = tit;
  $("avisoTxt").innerHTML = html;
  $("avisoIco").textContent = ico || "ℹ️";
  $("mAviso").classList.add("on");
  $("velo").classList.add("on");
}
function cerrarAviso(){
  $("mAviso").classList.remove("on");
  if (!document.querySelector(".gaveta.on, #mDatos.on, #mFinal.on")) $("velo").classList.remove("on");
}
function cerrarModales(){
  $("mDatos").classList.remove("on");
  $("mFinal").classList.remove("on");
  abrirCarrito();
}
function cerrarTodo(){
  document.querySelectorAll(".gaveta,.modal").forEach(e => e.classList.remove("on"));
  $("velo").classList.remove("on");
}

let tToast;
function toast(msg){
  const t = $("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(tToast); tToast = setTimeout(() => t.classList.remove("on"), 2200);
}

// Ningún input numérico cambia con la rueda del mouse
document.addEventListener("wheel", e => {
  const a = document.activeElement;
  if (a && a.type === "number" && a === e.target) a.blur();
}, { passive: true });
document.addEventListener("keydown", e => { if (e.key === "Escape") cerrarTodo(); });

cargar();
</script>
